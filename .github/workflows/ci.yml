name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repository checks
        run: node scripts/check-repo.mjs
      - name: Guard hook tests
        working-directory: guards
        run: node --test 'hooks/*.test.mjs'
      - name: Local CI example tests
        run: node --test 'examples/ci-local/*.test.mjs'
      - name: System map starter tests
        working-directory: examples/system-map
        run: |
          npm ci --ignore-scripts
          node --test '*.test.mjs'
          node check.mjs --config example/system-map.config.json

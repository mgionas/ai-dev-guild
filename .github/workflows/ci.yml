name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # One cell per system and Node version the guild's scripts say they support (Node 22.5 and later).
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      # Actions are pinned to a full commit so a moved tag cannot change what runs; the version is in the comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The system map check compares its baseline with main's copy, so it needs main's history.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Repository checks
        run: node scripts/check-repo.mjs
      - name: Page template checks
        run: node scripts/check-pages.mjs
      - name: Checker tests
        run: node --test 'scripts/*.test.mjs'
      - name: Guard hook tests
        working-directory: guards
        run: node --test 'hooks/*.test.mjs'
      - name: Local CI example tests
        run: node --test 'examples/ci-local/*.test.mjs'
      - name: Flow stats example tests
        run: node --test 'examples/flow-stats/*.test.mjs'
      - name: System map starter tests
        working-directory: examples/system-map
        run: |
          npm ci --ignore-scripts
          node --test '*.test.mjs'
          node check.mjs --config example/system-map.config.json --base origin/main

  # Every manifest must pass the plugin validator with warnings counted as failures, the same check the
  # plugin directory runs first. The validator is pinned: an older Claude Code does not know the directory's
  # listing fields (documentationUrl, supportUrl, privacyPolicyUrl) and warns on them.
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Validate the marketplace and both plugins
        run: |
          for path in . plugin guards; do
            npx --yes @anthropic-ai/claude-code@2.1.325 plugin validate --strict "$path"
          done

  # The branch ruleset on main requires a status check named exactly "checks". Matrix cells report under
  # their own names, so this job carries that name and passes only when every cell and the manifest check
  # passed; when one fails, this job is skipped and the required check stays unmet.
  checks:
    name: checks
    needs: [test, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Every matrix cell and the manifest check passed."

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="ai-dev-guild: one agent builds, another inspects, nothing ships without proof">
<defs>
<marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker>
<marker id="b-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="298" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<g transform="translate(70 92)">
<circle cx="34" cy="34" r="32" fill="#2e2a1a" stroke="#e3b341" stroke-width="2.5"/>
<circle cx="34" cy="34" r="25" fill="none" stroke="#e3b341" stroke-width="1" stroke-dasharray="2 3"/>
<path d="M21 35 L30 44 L48 24" fill="none" stroke="#e3b341" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="160" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="#f0f6fc">ai-dev-guild</text>
<text x="160" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#f0f6fc">A guild of AI agents for Claude Code.</text>
<text x="160" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#9198a1">One builds. Another inspects.</text>
<text x="160" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e3b341">Nothing ships without proof.</text>
<rect x="568" y="128" width="124" height="74" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="630" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f6fc">Brief</text>
<text x="630" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">one task, one file</text>
<path d="M693 165 L717 165" stroke="#9198a1" stroke-width="2" marker-end="url(#a-dark)"/>
<rect x="718" y="128" width="124" height="74" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="780" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f6fc">Build</text>
<text x="780" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">a fresh agent</text>
<path d="M843 165 L867 165" stroke="#9198a1" stroke-width="2" marker-end="url(#a-dark)"/>
<rect x="868" y="128" width="124" height="74" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="930" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f6fc">Inspect</text>
<text x="930" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">never the builder</text>
<path d="M993 165 L1017 165" stroke="#9198a1" stroke-width="2" marker-end="url(#a-dark)"/>
<rect x="1018" y="128" width="124" height="74" rx="12" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
<text x="1080" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f0f6fc">Proof</text>
<text x="1080" y="184" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">tests pasted</text>
<path d="M930 204 C930 250, 780 250, 780 210" fill="none" stroke="#e3b341" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#b-dark)"/>
<text x="855" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#e3b341">fix with a fresh agent, re-check once</text>
</svg>

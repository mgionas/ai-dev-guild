<path d="M200 405 L200 455" stroke="#9198a1" stroke-width="2" marker-end="url(#m)"/>
<path d="M200 579 L200 629" stroke="#9198a1" stroke-width="2" marker-end="url(#m)"/>
<rect x="37" y="816" width="326" height="118" rx="14" fill="#2e2a1a" stroke="#e3b341" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="70" cy="846" r="15" fill="#e3b341"/>
<text x="70" y="852" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">5</text>
<text x="93" y="853" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">Testers</text>
<text x="57" y="888" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e3b341">Pass · Fail · Blocked</text>
<text x="57" y="914" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">result and note on a check</text>
<path d="M35 875 L23 875 L23 517 L34 517" fill="none" stroke="#e3b341" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="37" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9198a1">A change is written to the pages in the</text>
<text x="37" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9198a1">same turn, so they are never behind.</text>
<text x="37" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6fc">Progress, test results and decisions live</text>
<text x="37" y="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6fc">on a page, not in the chat scrollback.</text>
</g>
</svg>

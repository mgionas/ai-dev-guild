<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1393" width="540" height="1393" role="img" aria-label="How the living pages stay current: 1 an agent's change (a merge, a stage change, a test result or a decision); 2 written in the same turn into the page's data; 3 the living pages (roadmap, QA board, analysis page, project and system map); 4 you read them on a phone. Testers mark Pass, Fail or Blocked back on the QA board.">
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker>
</defs>
<rect x="1" y="1" width="538" height="1391" rx="22" fill="#0d1117" stroke="#30363d" stroke-width="1.8"/>
<g transform="scale(1.35)">
<rect x="37" y="110" width="326" height="118" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<circle cx="70" cy="140" r="15" fill="#e3b341"/>
<text x="70" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">1</text>
<text x="93" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">A change</text>
<text x="57" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e3b341">an agent finishes</text>
<text x="57" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">merge · stage · test · decision</text>
<rect x="37" y="284" width="326" height="118" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<circle cx="70" cy="314" r="15" fill="#e3b341"/>
<text x="70" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">2</text>
<text x="93" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">Same turn</text>
<text x="57" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e3b341">written to page data</text>
<text x="57" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">unprompted, no republish</text>
<rect x="37" y="458" width="326" height="118" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<circle cx="70" cy="488" r="15" fill="#e3b341"/>
<text x="70" y="494" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">3</text>
<text x="93" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">Living pages</text>
<text x="57" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e3b341">roadmap · QA board</text>
<text x="57" y="556" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">analysis · project · system map</text>
<rect x="37" y="632" width="326" height="118" rx="14" fill="#12261e" stroke="#3fb950" stroke-width="1.6"/>
<circle cx="70" cy="662" r="15" fill="#3fb950"/>
<text x="70" y="668" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">4</text>
<text x="93" y="669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">You read</text>
<text x="57" y="704" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#3fb950">on a phone</text>
<text x="57" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">no need to ask an agent</text>

<path d="M200 405 L200 455" stroke="#59636e" stroke-width="2" marker-end="url(#m)"/>
<path d="M200 579 L200 629" stroke="#59636e" stroke-width="2" marker-end="url(#m)"/>
<rect x="37" y="816" width="326" height="118" rx="14" fill="#fff8c5" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="70" cy="846" r="15" fill="#9a6700"/>
<text x="70" y="852" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">5</text>
<text x="93" y="853" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#1f2328">Testers</text>
<text x="57" y="888" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#9a6700">Pass · Fail · Blocked</text>
<text x="57" y="914" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#59636e">result and note on a check</text>
<path d="M35 875 L23 875 L23 517 L34 517" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="37" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#59636e">A change is written to the pages in the</text>
<text x="37" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#59636e">same turn, so they are never behind.</text>
<text x="37" y="978" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">Progress, test results and decisions live</text>
<text x="37" y="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">on a page, not in the chat scrollback.</text>
</g>
</svg>

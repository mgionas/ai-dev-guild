<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 410" width="1280" height="410" role="img" aria-label="How the living pages stay current: 1 an agent's change (a merge, a stage change, a test result or a decision); 2 written in the same turn into the page's data; 3 the living pages (roadmap, QA board, analysis page, project and system map); 4 you read them on a phone. Testers mark Pass, Fail or Blocked back on the QA board.">
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#e3b341"/></marker>
</defs>
<rect x="1" y="1" width="1278" height="408" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<rect x="25" y="58" width="270" height="118" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<circle cx="58" cy="88" r="15" fill="#e3b341"/>
<text x="58" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">1</text>
<text x="81" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">A change</text>
<text x="45" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e3b341">an agent finishes</text>
<text x="45" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">merge · stage · test · decision</text>
<rect x="345" y="58" width="270" height="118" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<circle cx="378" cy="88" r="15" fill="#e3b341"/>
<text x="378" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">2</text>
<text x="401" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">Same turn</text>
<text x="365" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e3b341">written to page data</text>
<text x="365" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">unprompted, no republish</text>
<rect x="665" y="58" width="270" height="118" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<circle cx="698" cy="88" r="15" fill="#e3b341"/>
<text x="698" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">3</text>
<text x="721" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">Living pages</text>
<text x="685" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e3b341">roadmap · QA board</text>
<text x="685" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">analysis · project · system map</text>
<rect x="985" y="58" width="270" height="118" rx="14" fill="#12261e" stroke="#3fb950" stroke-width="1.6"/>
<circle cx="1018" cy="88" r="15" fill="#3fb950"/>
<text x="1018" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">4</text>
<text x="1041" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">You read</text>
<text x="1005" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#3fb950">on a phone</text>
<text x="1005" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">no need to ask an agent</text>

<path d="M618 117 L662 117" stroke="#9198a1" stroke-width="2" marker-end="url(#m)"/>
<path d="M938 117 L982 117" stroke="#9198a1" stroke-width="2" marker-end="url(#m)"/>
<rect x="665" y="238" width="270" height="118" rx="14" fill="#2e2a1a" stroke="#e3b341" stroke-width="1.6" stroke-dasharray="6 4"/>
<circle cx="698" cy="268" r="15" fill="#e3b341"/>
<text x="698" y="274" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0d1117">5</text>
<text x="721" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#f0f6fc">Testers</text>
<text x="685" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#e3b341">Pass · Fail · Blocked</text>
<text x="685" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#9198a1">result and note on a check</text>
<path d="M800 235 L800 179" stroke="#e3b341" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ma)"/>
<text x="810" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#e3b341">marks back</text>
<text x="640" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9198a1">A change is written to the pages in the same turn, so they are never behind.</text>
<text x="23" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f0f6fc">Progress, test results and decisions live on a page, not in the chat scrollback.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1144" width="540" height="1144" role="img" aria-label="How plain-report works: 1 a draft report such as “Robust fix. All tests pass.”; 2 check one, plain phrasing; 3 check two, each claim matched to its evidence; 4 the sent report, the plain version with the test count and what was not run.">
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/></marker>
</defs>
<rect x="1" y="1" width="538" height="1142" rx="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1.8"/>
<g transform="scale(1.35)">
<rect x="37" y="110" width="326" height="118" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<circle cx="70" cy="140" r="15" fill="#9a6700"/>
<text x="70" y="146" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
<text x="93" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#1f2328">Draft report</text>
<text x="57" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#9a6700">what the agent wrote</text>
<text x="57" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#59636e">“Robust fix. All tests pass.”</text>
<rect x="37" y="284" width="326" height="118" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<circle cx="70" cy="314" r="15" fill="#9a6700"/>
<text x="70" y="320" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
<text x="93" y="321" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#1f2328">Plain phrasing</text>
<text x="57" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#9a6700">no filler, no hype</text>
<text x="57" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#59636e">one point per sentence</text>
<rect x="37" y="458" width="326" height="118" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<circle cx="70" cy="488" r="15" fill="#9a6700"/>
<text x="70" y="494" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
<text x="93" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#1f2328">Claim vs evidence</text>
<text x="57" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#9a6700">verb no stronger than</text>
<text x="57" y="556" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#59636e">the test, command or file</text>
<rect x="37" y="632" width="326" height="118" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.6"/>
<circle cx="70" cy="662" r="15" fill="#1a7f37"/>
<text x="70" y="668" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4</text>
<text x="93" y="669" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="650" fill="#1f2328">Sent report</text>
<text x="57" y="704" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1a7f37">the plain version</text>
<text x="57" y="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#59636e">212/212 tests; suite not run</text>
<path d="M200 231 L200 281" stroke="#59636e" stroke-width="2" marker-end="url(#m)"/>
<path d="M200 405 L200 455" stroke="#59636e" stroke-width="2" marker-end="url(#m)"/>
<path d="M200 579 L200 629" stroke="#59636e" stroke-width="2" marker-end="url(#m)"/>
<text x="37" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#59636e">Two checks run on every text an agent</text>
<text x="37" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#59636e">writes for a person.</text>
<text x="37" y="794" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">“Fixed” only after a test went red, then</text>
<text x="37" y="816" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1f2328">green. A skipped step goes in the main text.</text>
</g>
</svg>

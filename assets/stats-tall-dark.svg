<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1106" width="540" height="1106" role="img" aria-label="What the loop catches, on average across 113 reviewed tasks built with this workflow, September to November 2026: about 90% of tasks had a blocking issue found by an independent reviewer before merge; about 70% of security reviews found a real issue; about 95% of question batches were answered with one accept all; at least 20% of tasks needed a second fix round; about 10% of fix rounds broke something new that the next check caught; at least 5% of done reports claimed more than their evidence.">
<rect x="1" y="1" width="538" height="1104" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="270" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9198a1">On average, across 113 reviewed tasks</text>
<text x="270" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9198a1">built with this workflow (Sep to Nov 2026)</text>
<rect x="22" y="62" width="496" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="42" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#3fb950">~90%</text>
<text x="42" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of tasks: an independent reviewer</text>
<text x="42" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">found a blocking issue before merge</text>
<text x="42" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9198a1">103 of 113 tasks</text>
<rect x="22" y="228" width="496" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="42" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#3fb950">~70%</text>
<text x="42" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of security reviews found</text>
<text x="42" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">a real issue to fix</text>
<text x="42" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9198a1">47 of 69 reviews</text>
<rect x="22" y="394" width="496" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="42" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#3fb950">~95%</text>
<text x="42" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of question batches answered</text>
<text x="42" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">with one &quot;accept all&quot;</text>
<text x="42" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9198a1">67 of 71 batches</text>
<rect x="22" y="560" width="496" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="42" y="618" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e3b341">20%+</text>
<text x="42" y="648" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of tasks needed</text>
<text x="42" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">a second fix round</text>
<text x="42" y="694" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9198a1">at least 21 of 113</text>
<rect x="22" y="726" width="496" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="42" y="784" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e3b341">~10%</text>
<text x="42" y="814" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of fix rounds broke something new,</text>
<text x="42" y="834" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">caught by the next check</text>
<text x="42" y="860" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9198a1">5 of 48 re-checks</text>
<rect x="22" y="892" width="496" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="42" y="950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ff7b72">5%+</text>
<text x="42" y="980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of &quot;done&quot; reports claimed</text>
<text x="42" y="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">more than their evidence</text>
<text x="42" y="1026" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#9198a1">at least 7 of 113</text>
<text x="22" y="1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198a1">Rounded. &quot;+&quot; means at least: the records under-report.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 1106" width="540" height="1106" role="img" aria-label="What the loop catches, on average across 113 reviewed tasks built with this workflow, September to November 2026: about 90% of tasks had a blocking issue found by an independent reviewer before merge; about 70% of security reviews found a real issue; about 95% of question batches were answered with one accept all; at least 20% of tasks needed a second fix round; about 10% of fix rounds broke something new that the next check caught; at least 5% of done reports claimed more than their evidence.">
<rect x="1" y="1" width="538" height="1104" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="270" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#59636e">On average, across 113 reviewed tasks</text>
<text x="270" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#59636e">built with this workflow (Sep to Nov 2026)</text>
<rect x="22" y="62" width="496" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<text x="42" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1a7f37">~90%</text>
<text x="42" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">of tasks: an independent reviewer</text>
<text x="42" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">found a blocking issue before merge</text>
<text x="42" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e">103 of 113 tasks</text>
<rect x="22" y="228" width="496" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<text x="42" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1a7f37">~70%</text>
<text x="42" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">of security reviews found</text>
<text x="42" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">a real issue to fix</text>
<text x="42" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e">47 of 69 reviews</text>
<rect x="22" y="394" width="496" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<text x="42" y="452" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#1a7f37">~95%</text>
<text x="42" y="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">of question batches answered</text>
<text x="42" y="502" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">with one &quot;accept all&quot;</text>
<text x="42" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e">67 of 71 batches</text>
<rect x="22" y="560" width="496" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<text x="42" y="618" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#9a6700">20%+</text>
<text x="42" y="648" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">of tasks needed</text>
<text x="42" y="668" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">a second fix round</text>
<text x="42" y="694" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e">at least 21 of 113</text>
<rect x="22" y="726" width="496" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<text x="42" y="784" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#9a6700">~10%</text>
<text x="42" y="814" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">of fix rounds broke something new,</text>
<text x="42" y="834" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">caught by the next check</text>
<text x="42" y="860" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e">5 of 48 re-checks</text>
<rect x="22" y="892" width="496" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.6"/>
<text x="42" y="950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#cf222e">5%+</text>
<text x="42" y="980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">of &quot;done&quot; reports claimed</text>
<text x="42" y="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#1f2328">more than their evidence</text>
<text x="42" y="1026" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#59636e">at least 7 of 113</text>
<text x="22" y="1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#59636e">Rounded. &quot;+&quot; means at least: the records under-report.</text>
</svg>

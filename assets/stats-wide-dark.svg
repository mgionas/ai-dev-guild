<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 398" width="1280" height="398" role="img" aria-label="What the loop catches, on average across reviewed tasks built with this workflow: about 90% of tasks had a blocking issue found by an independent reviewer before merge; about 70% of security reviews found a real issue; about 95% of question batches were answered with one accept all; at least 20% of tasks needed a second fix round; about 10% of fix rounds broke something new that the next check caught; at least 5% of done reports claimed more than their evidence.">
<rect x="1" y="1" width="1278" height="396" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<text x="640" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9198a1">On average, across reviewed tasks built with this workflow</text>
<rect x="22" y="62" width="401.3333333333333" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="42" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#3fb950">~90%</text>
<text x="42" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of tasks: an independent reviewer</text>
<text x="42" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">found a blocking issue before merge</text>
<rect x="439.3333333333333" y="62" width="401.3333333333333" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="459.3333333333333" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#3fb950">~70%</text>
<text x="459.3333333333333" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of security reviews found</text>
<text x="459.3333333333333" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">a real issue to fix</text>
<rect x="856.6666666666666" y="62" width="401.3333333333333" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="876.6666666666666" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#3fb950">~95%</text>
<text x="876.6666666666666" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of question batches answered</text>
<text x="876.6666666666666" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">with one &quot;accept all&quot;</text>
<rect x="22" y="206" width="401.3333333333333" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="42" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e3b341">20%+</text>
<text x="42" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of tasks needed</text>
<text x="42" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">a second fix round</text>
<rect x="439.3333333333333" y="206" width="401.3333333333333" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="459.3333333333333" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#e3b341">~10%</text>
<text x="459.3333333333333" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of fix rounds broke something new,</text>
<text x="459.3333333333333" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">caught by the next check</text>
<rect x="856.6666666666666" y="206" width="401.3333333333333" height="128" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.6"/>
<text x="876.6666666666666" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ff7b72">5%+</text>
<text x="876.6666666666666" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">of &quot;done&quot; reports claimed</text>
<text x="876.6666666666666" y="314" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" fill="#f0f6fc">more than their evidence</text>
<text x="22" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9198a1">Rounded. &quot;+&quot; means at least: the records under-report.</text>
</svg>

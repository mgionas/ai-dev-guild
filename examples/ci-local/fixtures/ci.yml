# A workflow as a project keeps it: the runner starts empty, so setup and install are the
# workflow's own steps, and everything else is the local check's single `--full` run.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install
        run: npm ci
      - name: Check
        run: |
          node scripts/ci-local/ci-local.mjs --full

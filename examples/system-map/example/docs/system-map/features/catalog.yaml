    explanation: >-
      Anyone can see the books on the shelves and open one to read its details.
    status: built
    operations: ['GET /books', 'GET /books/{bookId}']
    screens: ['/books', '/books/[bookId]']
    tables: [book]
    decisions: []
  - id: add-a-book
    area: catalog
    name: Add a book
